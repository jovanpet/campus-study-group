<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blocked people</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#16181A}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #16181A; font-family: Arial, Helvetica, sans-serif; padding: 52px 24px 40px; display: flex; flex-direction: column; gap: 20px">
  <a href="Profile.dc.html" aria-label="Back to your profile" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16181A">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Blocked people</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #3C4043">They can't find you, send you requests, or see your sessions.</p>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
    <sc-for list="{{blocked}}" as="b" hint-placeholder-count="2">
      <li style="min-height: 64px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E4E1D9">
        <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0; background: #E9E6DF; color: #5F6368; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">{{b.initial}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 16px; font-weight: 700">{{b.name}}</div>
          <div style="font-size: 13px; color: #5F6368">{{b.major}}</div>
        </div>
        <button aria-label="{{b.unblockLabel}}" onClick="{{b.unblock}}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #D6D3CB; background: transparent; color: #16181A; font-size: 15px; font-weight: 700; flex-shrink: 0">Unblock</button>
      </li>
    </sc-for>
  </ul>

  <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
    <div style="padding: 40px 0; text-align: center; font-size: 15px; color: #5F6368">You haven't blocked anyone.</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unblocked: {} };
  }
  renderVals() {
    const list = [
      { key: 'tomas', initial: 'T', name: 'Tomas', major: 'Mathematics' },
      { key: 'kevin', initial: 'K', name: 'Kevin', major: 'Economics' }
    ]
      .filter((b) => !this.state.unblocked[b.key])
      .map((b) => ({
        ...b,
        unblockLabel: 'Unblock ' + b.name,
        unblock: () => this.setState({ unblocked: { ...this.state.unblocked, [b.key]: true } })
      }));
    return { blocked: list, empty: list.length === 0 };
  }
}
</script>
</body>
</html>
