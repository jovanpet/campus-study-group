<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Friends</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#16181A}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #F6F5F1; color: #16181A; font-family: Arial, Helvetica, sans-serif; padding: 52px 24px 40px; display: flex; flex-direction: column; gap: 28px; overflow: hidden">
  <header style="display: flex; flex-direction: column; gap: 8px">
    <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16181A">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Friends</h1>
  </header>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="add" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Add a friend</label>
    <div style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #D6D3CB; background: #FFFFFF; display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="add" type="search" placeholder="@username or name" style="flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: #16181A; font-size: 17px; outline: none; padding: 0">
    </div>
    <div style="font-size: 14px; color: #5F6368">Your username is <span style="color: #16181A; font-weight: 700">@jovan</span></div>
  </div>

  <section style="display: flex; flex-direction: column">
    <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368; display: flex; align-items: center; gap: 8px">
      Requests
      <span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 10px; background: #C2410C; color: #FFFFFF; font-size: 11px; letter-spacing: 0; display: inline-flex; align-items: center; justify-content: center">2</span>
    </h2>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
      <sc-for list="{{requests}}" as="r" hint-placeholder-count="2">
        <li style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #E4E1D9">
          <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; {{r.avatarStyle}}">{{r.initial}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="font-size: 16px; font-weight: 700">{{r.name}}</div>
            <div style="font-size: 14px; color: #5F6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.detail}}</div>
          </div>
          <button aria-label="{{r.declineLabel}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D6D3CB; background: transparent; color: #3C4043; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
          <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #16181A; color: #F6F5F1; font-size: 15px; font-weight: 700; flex-shrink: 0">Accept</button>
        </li>
      </sc-for>
    </ul>
  </section>

  <section style="display: flex; flex-direction: column">
    <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Your friends</h2>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
      <sc-for list="{{friends}}" as="f" hint-placeholder-count="5">
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E4E1D9">
          <a href="FriendProfile.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #16181A">
            <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; {{f.avatarStyle}}">{{f.initial}}</div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <div style="font-size: 16px; font-weight: 700">{{f.name}}</div>
              <div style="font-size: 14px; color: #5F6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.major}}</div>
            </div>
          </a>
          <button aria-label="{{f.menuLabel}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #5F6368; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
          </button>
        </li>
      </sc-for>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F7A4D&quot;,&quot;options&quot;:[&quot;#1F7A4D&quot;,&quot;#2F5BD3&quot;,&quot;#C2410C&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1120}}">
class Component extends DCLogic {
  renderVals() {
    const st = (bg, fg) => 'background: ' + bg + '; color: ' + fg;
    const friend = (initial, name, major, bg, fg) => ({
      initial, name, major, avatarStyle: st(bg, fg), menuLabel: 'Options for ' + name
    });
    return {
      accent: this.props.accent ?? '#1F7A4D',
      requests: [
        { initial: 'N', name: 'Nina', detail: 'Computer Science', declineLabel: 'Decline Nina', avatarStyle: st('#F2D3C9', '#4A2418') },
        { initial: 'D', name: 'David', detail: 'Economics', declineLabel: 'Decline David', avatarStyle: st('#C9D7F2', '#1F2B44') }
      ],
      friends: [
        friend('A', 'Ana', 'Neuroscience', '#E2D9C6', '#3A3226'),
        friend('I', 'Ines', 'Economics', '#E6D6EC', '#3B2443'),
        friend('L', 'Leo', 'Computer Science', '#C9D7F2', '#1F2B44'),
        friend('M', 'Marko', 'Computer Science', '#D6DBE6', '#262E3E'),
        friend('P', 'Priya', 'Computer Science', '#D3DED3', '#24382A'),
        friend('S', 'Sam', 'Computer Science', '#F2D3C9', '#4A2418')
      ]
    };
  }
}
</script>
</body>
</html>
