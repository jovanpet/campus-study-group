<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#16181A}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #F6F5F1; color: #16181A; font-family: Arial, Helvetica, sans-serif; padding: 52px 24px 40px; display: flex; flex-direction: column; gap: 28px">
  <a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16181A">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
    <div aria-hidden="true" style="width: 88px; height: 88px; box-sizing: border-box; border-radius: 44px; border: 1.5px solid #D6D3CB; background: #E9E6DF; color: #16181A; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700">J</div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Jovan</h1>
      <div style="font-size: 16px; color: #3C4043">@jovan</div>
      <div style="font-size: 14px; color: #5F6368">Brown University · Computer Science</div>
    </div>
    <a href="EditProfile.dc.html" style="margin-top: 4px; height: 44px; box-sizing: border-box; padding: 0 22px; border-radius: 22px; border: 1.5px solid #16181A; color: #16181A; text-decoration: none; display: flex; align-items: center; font-size: 15px; font-weight: 700">Edit profile</a>
  </div>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Your groups</h2>
    <ul style="list-style: none; margin: 0; padding: 0 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E1D9; display: flex; flex-direction: column">
      <li style="border-bottom: 1px solid #EEECE6">
        <a href="NewGroup.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: #16181A; font-size: 16px; font-weight: 700">
          CS 1670 study
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </li>
      <li style="border-bottom: 1px solid #EEECE6">
        <a href="NewGroup.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: #16181A; font-size: 16px; font-weight: 700">
          Late-night crew
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </li>
      <li>
        <a href="NewGroup.dc.html" style="min-height: 56px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #16181A; font-size: 16px">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          New group
        </a>
      </li>
    </ul>
  </section>

  <ul style="list-style: none; margin: 0; padding: 0 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E1D9; display: flex; flex-direction: column">
    <li style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #EEECE6">
      <span style="display: flex; flex-direction: column; gap: 2px; padding: 8px 0">
        <span id="notif" style="font-size: 16px">Do not disturb</span>
        <span style="font-size: 13px; color: #5F6368">{{dndHint}}</span>
      </span>
      <button role="switch" aria-checked="{{dndChecked}}" aria-labelledby="notif" onClick="{{toggleDnd}}" style="width: 52px; height: 32px; padding: 3px; box-sizing: border-box; border-radius: 16px; border: 0; flex-shrink: 0; display: flex; {{dndTrack}}">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span>
      </button>
    </li>
    <li style="border-bottom: 1px solid #EEECE6">
      <a href="Blocked.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: #16181A; font-size: 16px">
        Blocked people
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </li>
    <li>
      <a href="SignIn.dc.html" style="min-height: 56px; display: flex; align-items: center; text-decoration: none; color: #16181A; font-size: 16px">Sign out</a>
    </li>
  </ul>

  <div style="flex: 1"></div>

  <button style="height: 44px; border: 0; background: transparent; color: #B42318; font-size: 15px; font-weight: 700">Delete account</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4D","options":["#1F7A4D","#2F5BD3","#C2410C"]},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dnd: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#1F7A4D';
    const dnd = this.state.dnd;
    return {
      accent,
      dndChecked: dnd ? 'true' : 'false',
      dndHint: dnd ? 'No pings when friends start studying' : 'You get a ping when friends start',
      dndTrack: dnd ? 'background: ' + accent + '; justify-content: flex-end' : 'background: #D6D3CB; justify-content: flex-start',
      toggleDnd: () => this.setState({ dnd: !dnd })
    };
  }
}
</script>
</body>
</html>
