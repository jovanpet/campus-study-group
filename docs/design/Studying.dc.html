<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home — you're studying</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#16181A}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #16181A; font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 60px 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="Profile.dc.html" aria-label="Your profile" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1.5px solid #D6D3CB; background: #E9E6DF; color: #16181A; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0">J</a>
    <h1 style="margin: 0; height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1D9; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; white-space: nowrap"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: rgb(31, 122, 77)"></span>3&nbsp;friends studying
    </h1>
    <a href="Friends.dc.html" aria-label="Friends" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1.5px solid #D6D3CB; box-sizing: border-box; color: #16181A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg>
    </a>
  </header>

  <section aria-label="Your session" style="margin: 24px 24px 0; padding: 16px; border-radius: 20px; background: #16181A; color: #F6F5F1; display: flex; flex-direction: column; gap: 12px">
    <a href="MySession.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F6F5F1">
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #5BC48A; flex-shrink: 0"></span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">You · SciLi, 4th floor</div>
        <div style="font-size: 13px; color: #C9C7C1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Until 9:30 PM · Ana and Leo joined</div>
      </div>
      <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0">42m</span>
    </a>
    <div aria-hidden="true" style="height: 3px; border-radius: 2px; background: #3A3D41; overflow: hidden">
      <div style="width: 51%; height: 100%; border-radius: 2px; background: #5BC48A"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 44px; border-radius: 22px; border: 1.5px solid #4A4D52; background: transparent; color: #F6F5F1; font-size: 15px; font-weight: 700">View</button>
      <a href="Main.dc.html" style="height: 44px; border-radius: 22px; background: #F6F5F1; color: #16181A; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">End session</a>
    </div>
  </section>

  <section style="padding: 28px 24px 0; display: flex; flex-direction: column">
    <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Also studying</h2>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
      <sc-for list="{{live}}" as="s" hint-placeholder-count="2">
        <li style="border-bottom: 1px solid #E4E1D9">
          <a href="Session.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 0; text-decoration: none; color: #16181A">
          <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; {{s.avatarStyle}}">{{s.initial}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</div>
            <div style="font-size: 15px; color: #3C4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.place}}</div>
            <div style="font-size: 13px; color: #5F6368; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.meta}}</div>
          </div>
          </a>
        </li>
      </sc-for>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4D","options":["#1F7A4D","#2F5BD3","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#1F7A4D',
      live: [
        { initial: 'P', name: 'Priya', place: 'CIT 3rd floor lounge', meta: '38m · until 9:30 PM', avatarStyle: 'background: #D3DED3; color: #24382A' },
        { initial: 'M', name: 'Marko', place: 'Blue State Coffee', meta: '2h 05m', avatarStyle: 'background: #D6DBE6; color: #262E3E' }
      ]
    };
  }
}
</script>
</body>
</html>
