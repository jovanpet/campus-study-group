<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ana's profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#16181A}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #16181A; font-family: Arial, Helvetica, sans-serif; padding: 52px 24px 40px; display: flex; flex-direction: column; gap: 28px">
  <a href="Friends.dc.html" aria-label="Back to friends" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16181A">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
    <div aria-hidden="true" style="width: 88px; height: 88px; border-radius: 44px; background: #E2D9C6; color: #3A3226; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700">A</div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Ana</h1>
      <div style="font-size: 16px; color: #3C4043">@ana.m</div>
      <div style="font-size: 14px; color: #5F6368">Brown University · Neuroscience</div>
      <div style="font-size: 14px; color: #5F6368">Friends since September</div>
    </div>
  </div>

  <a href="Session.dc.html" style="padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E1D9; text-decoration: none; color: #16181A; display: flex; align-items: center; gap: 12px">
    <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}; flex-shrink: 0"></span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <div style="font-size: 13px; font-weight: 700; color: {{accent}}">Studying now</div>
      <div style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">SciLi, 4th floor quiet room</div>
      <div style="font-size: 13px; color: #5F6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">1h 12m</div>
    </div>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <div style="flex: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button style="height: 44px; border-radius: 22px; border: 1.5px solid #D6D3CB; background: transparent; color: #16181A; font-size: 15px; font-weight: 700">Remove friend</button>
    <button style="height: 44px; border-radius: 22px; border: 1.5px solid #D6D3CB; background: transparent; color: #B42318; font-size: 15px; font-weight: 700">Block</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4D","options":["#1F7A4D","#2F5BD3","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F7A4D' };
  }
}
</script>
</body>
</html>
