<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#16181A}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #16181A; font-family: Arial, Helvetica, sans-serif; padding: 72px 24px 40px; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Set up your profile</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #3C4043">Friends find you by your username or name.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="name" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Name</label>
      <input id="name" type="text" value="Jovan" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #D6D3CB; background: #FFFFFF; color: #16181A; font-size: 17px; outline: none">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="username" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Username</label>
      <div style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #16181A; background: #FFFFFF; display: flex; align-items: center; gap: 2px">
        <span aria-hidden="true" style="font-size: 17px; color: #5F6368">@</span>
        <input id="username" type="text" value="jovan" style="flex: 1; min-width: 0; height: 100%; border: 0; padding: 0; background: transparent; color: #16181A; font-size: 17px; outline: none">
      </div>
      <div style="font-size: 14px; color: {{accent}}; display: flex; align-items: center; gap: 6px">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Available
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div id="school-label" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">School</div>
      <button aria-labelledby="school-label school-value" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #D6D3CB; background: #FFFFFF; color: #16181A; display: flex; align-items: center; justify-content: space-between; font-size: 17px; text-align: left">
        <span id="school-value">Brown University</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div id="major-label" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Major</div>
      <button aria-labelledby="major-label major-value" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #D6D3CB; background: #FFFFFF; color: #5F6368; display: flex; align-items: center; justify-content: space-between; font-size: 17px; text-align: left">
        <span id="major-value">Choose a major</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex: 1"></div>

  <a href="EmptyHome.dc.html" style="height: 56px; border-radius: 28px; background: #16181A; color: #F6F5F1; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4D","options":["#1F7A4D","#2F5BD3","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F7A4D' };
  }
}
</script>
</body>
</html>
