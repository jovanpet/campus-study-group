<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#16181A}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #16181A; font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
    <header style="padding: 60px 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="Profile.dc.html" aria-label="Your profile" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1.5px solid #D6D3CB; background: #E9E6DF; color: #16181A; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; flex-shrink: 0">J</a>
      <h1 style="margin: 0; height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E4E1D9; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: 0; white-space: nowrap">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>
        3 friends studying
      </h1>
      <a href="Friends.dc.html" aria-label="Friends, 2 new requests" style="position: relative; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1.5px solid #D6D3CB; box-sizing: border-box; color: #16181A; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg>
        <span aria-hidden="true" style="position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 10px; border: 2px solid #F6F5F1; background: #C2410C; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
      </a>
    </header>

    <section style="padding: 24px 24px 0; display: flex; flex-direction: column">
      <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Studying now</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{live}}" as="s" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #E4E1D9">
            <a href="Session.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #16181A">
            <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; {{s.avatarStyle}}">{{s.initial}}</div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <div style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</div>
              <div style="font-size: 15px; color: #3C4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.place}}</div>
              <div style="font-size: 13px; color: #5F6368; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.meta}}</div>
              <sc-if value="{{s.hasEnd}}" hint-placeholder-val="{{false}}">
                <div aria-hidden="true" style="margin-top: 4px; width: 140px; height: 4px; border-radius: 2px; background: #E4E1D9; overflow: hidden">
                  <div style="height: 100%; border-radius: 2px; background: {{accent}}; {{s.barStyle}}"></div>
                </div>
              </sc-if>
            </div>
            </a>
            <button aria-pressed="{{s.pressed}}" onClick="{{s.toggle}}" style="height: 44px; padding: 0 16px; border-radius: 22px; font-size: 15px; font-weight: 700; flex-shrink: 0; display: flex; align-items: center; gap: 6px; {{s.btnStyle}}">
              <sc-if value="{{s.joined}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </sc-if>
              {{s.btnLabel}}
            </button>
          </li>
        </sc-for>
      </ul>
    </section>

    <section style="padding: 28px 24px 0; display: flex; flex-direction: column">
      <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6368">Later today</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{later}}" as="p" hint-placeholder-count="2">
          <li style="display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #E4E1D9">
            <a href="Session.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #16181A">
            <div aria-hidden="true" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1.5px dashed #9A968D; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; background: transparent; color: #3C4043">{{p.initial}}</div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <div style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</div>
              <div style="font-size: 15px; color: #3C4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.place}}</div>
              <div style="font-size: 13px; color: #5F6368; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; min-width: 0">
                <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.meta}}</span>
              </div>
            </div>
            </a>
            <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #D6D3CB; background: transparent; color: #16181A; font-size: 15px; font-weight: 700; flex-shrink: 0">I'll go</button>
          </li>
        </sc-for>
      </ul>
    </section>

  </div>

  <footer style="padding: 12px 24px 34px; background: #F6F5F1; border-top: 1px solid #E4E1D9; display: flex; flex-direction: column">
    <a href="StartSheet.dc.html" style="height: 56px; border-radius: 28px; background: #16181A; color: #F6F5F1; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Start studying
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4D","options":["#1F7A4D","#2F5BD3","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { joined: 'marko' };
  }
  renderVals() {
    const rows = [
      { key: 'ana', initial: 'A', name: 'Ana', place: 'SciLi, 4th floor quiet room', meta: '1h 12m', hasEnd: false, barStyle: '', avatarStyle: 'background: #E2D9C6; color: #3A3226' },
      { key: 'priya', initial: 'P', name: 'Priya', place: 'CIT 3rd floor lounge', meta: '38m · until 9:30 PM', hasEnd: true, barStyle: 'width: 40%', avatarStyle: 'background: #D3DED3; color: #24382A' },
      { key: 'marko', initial: 'M', name: 'Marko', place: 'Blue State Coffee', meta: '2h 05m', hasEnd: false, barStyle: '', avatarStyle: 'background: #D6DBE6; color: #262E3E' }
    ];
    return {
      accent: this.props.accent ?? '#1F7A4D',
      live: rows.map((r) => {
        const joined = this.state.joined === r.key;
        return {
          ...r, joined,
          pressed: joined ? 'true' : 'false',
          btnLabel: joined ? 'Joined' : 'Join',
          btnStyle: joined
            ? 'border: 1.5px solid #16181A; background: #16181A; color: #F6F5F1'
            : 'border: 1.5px solid #16181A; background: transparent; color: #16181A',
          toggle: () => this.setState({ joined: joined ? null : r.key })
        };
      }),
      later: [
        { initial: 'L', name: 'Leo', place: 'Rock, B level', meta: '8:00 – 10:00 PM' },
        { initial: 'N', name: 'Nina', place: 'SciLi, 3rd floor', meta: 'Starts 9:15 PM' }
      ]
    };
  }
}
</script>
</body>
</html>
