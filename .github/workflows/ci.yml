name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button for re-deploys

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_study_group_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/campus_study_group_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  deploy:
    # Runs on every push to main (or a manual run), then waits for approval:
    # the production environment requires a reviewer (repo Settings -> Environments).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [vet, test, lint]
    runs-on: ubuntu-latest
    concurrency:
      group: heroku-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://campus-study-group-9ad6385213f5.herokuapp.com/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Heroku rejects pushes from shallow clones
      # A plain `git push` is a no-op when Heroku already has this commit (e.g. when
      # re-running a deploy whose release command failed), so in that case create a
      # new release from the commit's existing build through the Platform API.
      - name: Deploy to Heroku
        id: deploy
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: campus-study-group
        run: |
          set -euo pipefail
          api() {
            local path=$1; shift
            curl -fsS "https://api.heroku.com${path}" \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer ${HEROKU_API_KEY}" "$@"
          }

          sha="${GITHUB_SHA:0:8}"
          before=$(api "/apps/${HEROKU_APP}/releases" -H "Range: version ..; order=desc, max=1" | jq -r '.[0].version // 0')
          echo "before_version=${before}" >> "$GITHUB_OUTPUT"

          remote="https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git"
          deployed=$(git ls-remote "$remote" refs/heads/main | cut -f1)

          if [ "$deployed" != "$GITHUB_SHA" ]; then
            git push "$remote" HEAD:refs/heads/main
            exit 0
          fi

          echo "Heroku already has ${sha}; re-releasing its existing build instead of pushing."
          slug=$(api "/apps/${HEROKU_APP}/builds" -H "Range: created_at ..; order=desc, max=50" \
            | jq -r --arg sha "$GITHUB_SHA" \
                '[.[] | select(.source_blob.version == $sha and .status == "succeeded")][0].slug.id // empty')
          if [ -z "$slug" ]; then
            echo "::error title=No Heroku build for ${sha}::Heroku has ${sha} but no successful build of it to release."
            exit 1
          fi

          body=$(jq -n --arg slug "$slug" --arg d "Deploy ${sha} (re-release)" '{slug: $slug, description: $d}')
          release=$(api "/apps/${HEROKU_APP}/releases" -X POST -H "Content-Type: application/json" -d "$body")
          echo "Created release v$(jq -r .version <<<"$release") from slug ${slug}"

      # Neither path above fails when the release phase (migrations) fails, so check
      # the status of the release created for this commit by this run.
      - name: Verify Heroku release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: campus-study-group
          BEFORE_VERSION: ${{ steps.deploy.outputs.before_version }}
        run: |
          set -euo pipefail
          api() {
            curl -fsS "https://api.heroku.com$1" \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer ${HEROKU_API_KEY}" \
              -H "Range: version ..; order=desc, max=10"
          }

          sha="${GITHUB_SHA:0:8}"
          release=""
          status=""
          # Up to 5 minutes for the release to appear and its release command to finish.
          for _ in $(seq 1 60); do
            release=$(api "/apps/${HEROKU_APP}/releases" \
              | jq --arg sha "$sha" --argjson before "$BEFORE_VERSION" \
                  '[.[] | select(.version > $before and (.description | contains($sha)))][0] // empty')
            if [ -n "$release" ]; then
              status=$(jq -r .status <<<"$release")
              [ "$status" != "pending" ] && break
            fi
            sleep 5
          done

          if [ -z "$release" ]; then
            echo "::error title=Heroku release not found::No release for ${sha} was created after v${BEFORE_VERSION}."
            exit 1
          fi

          version=$(jq -r .version <<<"$release")
          description=$(jq -r .description <<<"$release")
          echo "Release for ${sha}: v${version} (${status}) - ${description}"

          if [ "$status" != "succeeded" ]; then
            echo "::error title=Heroku release v${version} ${status}::Release command failed for ${sha}. Production is still on the previous release. See the release output below."
            output_url=$(jq -r '.output_stream_url // empty' <<<"$release")
            output=""
            if [ -n "$output_url" ]; then
              output=$(curl -fsS "$output_url" || true)
              echo "----- release command output -----"
              echo "$output"
            fi
            {
              echo "## ❌ Heroku release v${version} ${status}"
              echo "Commit \`${sha}\` built, but the release command failed, so it was **not** deployed."
              echo '```'
              echo "${output:-no release output available}" | tail -n 50
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## ✅ Heroku release v${version} succeeded (\`${sha}\`)" >> "$GITHUB_STEP_SUMMARY"
