name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button for re-deploys

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_study_group_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/campus_study_group_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  deploy:
    # Runs on every push to main (or a manual run), then waits for approval:
    # the production environment requires a reviewer (repo Settings -> Environments).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [vet, test, lint]
    runs-on: ubuntu-latest
    concurrency:
      group: heroku-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://campus-study-group-9ad6385213f5.herokuapp.com/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Heroku rejects pushes from shallow clones
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: campus-study-group
        run: git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git" HEAD:refs/heads/main

      # `git push` exits 0 even when the release phase (migrations) fails,
      # so check the release status through the Heroku Platform API.
      - name: Verify Heroku release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: campus-study-group
        run: |
          set -euo pipefail
          api() {
            curl -fsS "https://api.heroku.com$1" \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer ${HEROKU_API_KEY}" \
              -H "Range: version ..; order=desc, max=1"
          }

          sha="${GITHUB_SHA:0:8}"
          for _ in $(seq 1 60); do
            release=$(api "/apps/${HEROKU_APP}/releases" | jq '.[0]')
            status=$(jq -r .status <<<"$release")
            [ "$status" != "pending" ] && break
            sleep 5
          done

          version=$(jq -r .version <<<"$release")
          description=$(jq -r .description <<<"$release")
          echo "Latest release: v${version} (${status}) - ${description}"

          if [[ "$description" != *"$sha"* ]]; then
            echo "::error title=Heroku release not found::Latest release v${version} is not for commit ${sha}: ${description}"
            exit 1
          fi

          if [ "$status" != "succeeded" ]; then
            echo "::error title=Heroku release v${version} ${status}::Release command failed for ${sha}. Production is still on the previous release. See the release output below."
            output_url=$(jq -r '.output_stream_url // empty' <<<"$release")
            output=""
            if [ -n "$output_url" ]; then
              output=$(curl -fsS "$output_url" || true)
              echo "----- release command output -----"
              echo "$output"
            fi
            {
              echo "## ❌ Heroku release v${version} ${status}"
              echo "Commit \`${sha}\` built, but the release command failed, so it was **not** deployed."
              echo '```'
              echo "${output:-no release output available}" | tail -n 50
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "## ✅ Heroku release v${version} succeeded (\`${sha}\`)" >> "$GITHUB_STEP_SUMMARY"
